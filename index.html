<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>来訪受付</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#edf2f9; --surface:#edf2f9; --surface-2:#e3eaf4; --border:#d3dcea;
    --ink:#2b3a52; --ink-muted:#5c6f8a;
    --accent:#1f6fc4; --accent-ink:#0a2a4d; --accent-soft:#d9e8f9;
    --grad:linear-gradient(135deg,#74d2ff 0%,#47a9f4 100%);
    --grad-soft:linear-gradient(135deg,#e3f2ff 0%,#d9e8fb 100%);
    --warn:#8a5a10; --warn-soft:#f3e6cf;
    --danger:#b23f38; --danger-soft:#f6dedb;
    --good:#16794f; --good-soft:#d9efe3;
    /* ニューモーフィズム：明るい影(左上)と暗い影(右下)で、面を押し出し・へこませる */
    --nm-l:#ffffff; --nm-d:#c9d4e4;
    --grad-text:linear-gradient(135deg,#1d8fd9 0%,#1f5fbf 100%);
    --sh-raise:7px 7px 16px var(--nm-d), -7px -7px 16px var(--nm-l);
    --sh-raise-s:4px 4px 9px var(--nm-d), -4px -4px 9px var(--nm-l);
    --sh-inset:inset 3px 3px 7px var(--nm-d), inset -3px -3px 7px var(--nm-l);
    --shadow:var(--sh-raise);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#212a37; --surface:#212a37; --surface-2:#1b2330; --border:#344256;
      --ink:#e3ebf6; --ink-muted:#9fb1c9;
      --accent:#6cc4ff; --accent-ink:#06223f; --accent-soft:#233a54;
      --grad-soft:linear-gradient(135deg,#233a54 0%,#24324a 100%);
      --warn:#e6b46c; --warn-soft:#3a2c12;
      --danger:#f08f88; --danger-soft:#3d2224;
      --good:#7fdca6; --good-soft:#1b3a2a;
      --nm-l:#2b3547; --nm-d:#161c26;
      --grad-text:var(--grad);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#212a37; --surface:#212a37; --surface-2:#1b2330; --border:#344256;
    --ink:#e3ebf6; --ink-muted:#9fb1c9;
    --accent:#6cc4ff; --accent-ink:#06223f; --accent-soft:#233a54;
    --grad-soft:linear-gradient(135deg,#233a54 0%,#24324a 100%);
    --warn:#e6b46c; --warn-soft:#3a2c12;
    --danger:#f08f88; --danger-soft:#3d2224;
    --good:#7fdca6; --good-soft:#1b3a2a;
    --nm-l:#2b3547; --nm-d:#161c26;
    --grad-text:var(--grad);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .wrap{ max-width:440px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding:24px 18px 32px; }
  header{ text-align:center; margin-bottom:18px; }
  header .mark{ font-size:19px; font-weight:700; letter-spacing:.02em; color:var(--accent); background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  header .sub{ font-size:12.5px; color:var(--ink-muted); margin-top:4px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:var(--shadow); }

  .field-group{ margin-bottom:4px; }

  label{ display:block; font-size:12.5px; color:var(--ink-muted); margin:14px 0 6px; font-weight:600; }
  label:first-of-type{ margin-top:0; }
  input[type=text]{
    width:100%; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:12px 13px; font-size:16px; font-family:inherit; outline:none;
  }
  input:focus{ border-color:var(--accent); }

  .remembered-chip{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:11px 13px;
  }
  .remembered-chip .chip-text{ font-size:15px; font-weight:700; overflow-wrap:anywhere; }

  .check-row{
    display:flex; align-items:center; gap:8px; margin:9px 0 4px;
    font-size:12.5px; color:var(--ink-muted); font-weight:500; cursor:pointer;
  }
  .check-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--accent); flex:none; cursor:pointer; margin:0; }

  .stepper{ display:flex; align-items:center; gap:12px; justify-content:center; margin-top:6px; }
  .stepper button{
    width:46px; height:46px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
    font-size:20px; color:var(--ink); flex:none; font-family:inherit; cursor:pointer;
  }
  .stepper .val{ min-width:56px; text-align:center; font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:700; }

  button.btn{ font-family:inherit; cursor:pointer; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:13px 16px;
    font-size:15.5px; font-weight:700; width:100%;
  }
  .btn.primary{ background:var(--grad); border-color:transparent; color:var(--accent-ink); }

  .btn.ghost{ background:transparent; border-color:transparent; color:var(--accent); font-weight:600; font-size:13.5px; padding:8px; }
  .btn.ghost.small{ width:auto; padding:7px 11px; font-size:12.5px; flex:none; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .err{ font-size:12.5px; color:var(--danger); margin-top:10px; text-align:center; display:none; }
  .err.show{ display:block; }

  .done{ text-align:center; padding:20px 6px; }
  .done .icon{ width:56px; height:56px; border-radius:999px; background:var(--good-soft); color:var(--good); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; transition:background .25s,color .25s; }
  .done .icon.pending{ background:var(--surface-2); color:var(--ink-muted); }
  /* 完了：輪が広がり、紙吹雪が弾け、文字がふわっと現れる */
  .done .icon.celebrate::after{ content:""; position:absolute; inset:0; border-radius:inherit; border:3px solid var(--accent); opacity:0; animation:done-ring .9s .1s ease-out; }
  @keyframes done-ring{ 0%{ transform:scale(1); opacity:.75; } 100%{ transform:scale(2.5); opacity:0; } }
  .burst{ position:absolute; inset:0; pointer-events:none; }
  .burst i{ position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px; border-radius:50%; background:var(--c); opacity:0; animation:burst .95s .12s cubic-bezier(.1,.7,.3,1) forwards; }
  .burst i:nth-child(3n){ width:6px; height:6px; margin:-3px; border-radius:2px; }
  @keyframes burst{ 0%{ opacity:1; transform:rotate(var(--a)) translateY(-24px) scale(.4); } 100%{ opacity:0; transform:rotate(var(--a)) translateY(-66px) scale(1) rotate(160deg); } }
  .done .icon.celebrate ~ h2, .done .icon.celebrate ~ p{ animation:rise .5s .4s ease-out both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .done h2{ font-size:19px; margin:0 0 8px; }
  .keep-open{ background:var(--surface-2); border-radius:12px; padding:12px 14px; font-size:13px !important; color:var(--ink) !important; line-height:1.7; text-align:left; }
  .done p{ font-size:14px; color:var(--ink-muted); line-height:1.7; margin:0 0 20px; }

  .steps{ display:flex; align-items:center; justify-content:center; gap:8px; margin:0 0 18px; }
  .step{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-muted); }
  .step .dot{ width:9px; height:9px; border-radius:999px; background:var(--border); flex:none; }
  .step.done-step{ color:var(--good); font-weight:600; }
  .step.done-step .dot{ background:var(--good); }
  .step.active-step .dot{ background:var(--accent); animation:pulse 1.4s ease-in-out infinite; }
  .step-line{ width:20px; height:1px; background:var(--border); flex:none; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  /* 待機中：アイコンのまわりにゆっくり広がる輪 */
  .done .icon{ position:relative; }
  .done .icon.pending::before, .done .icon.pending::after{
    content:""; position:absolute; inset:0; border-radius:inherit; border:2px solid var(--accent); opacity:0;
    animation:wait-ring 2.4s ease-out infinite;
  }
  .done .icon.pending::after{ animation-delay:1.2s; }
  @keyframes wait-ring{ 0%{ transform:scale(1); opacity:.45; } 100%{ transform:scale(1.9); opacity:0; } }
  /* 完了：アイコンがぽんと弾み、チェックが描かれる */
  .done .icon.celebrate{ animation:icon-pop .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes icon-pop{ 0%{ transform:scale(.6); } 100%{ transform:scale(1); } }
  .done .icon.celebrate path{ stroke-dasharray:1; stroke-dashoffset:1; animation:check-draw .45s .15s ease-out forwards; }
  @keyframes check-draw{ to{ stroke-dashoffset:0; } }
  @media (prefers-reduced-motion: reduce){
    .step.active-step .dot{ animation:none; }
    .done .icon.pending::before, .done .icon.pending::after{ animation:none; display:none; }
    .done .icon.celebrate, .done .icon.celebrate path, .done .icon.celebrate::after, .burst i, .done .icon.celebrate ~ h2, .done .icon.celebrate ~ p{ animation:none; stroke-dashoffset:0; }
    .burst{ display:none; }
  }

  .return-box{ margin-top:22px; padding-top:18px; border-top:1px dashed var(--border); display:flex; flex-direction:column; gap:8px; }
  .return-box .return-label{ font-size:12.5px; color:var(--ink-muted); font-weight:600; text-align:center; }
  .return-head{ font-size:17px; margin:0 0 6px; }
  .return-lead{ font-size:13px; color:var(--ink-muted); line-height:1.7; margin:0 0 6px; }
  .hint{ font-size:12px; color:var(--ink-muted); text-align:center; margin-top:14px; line-height:1.6; }
  .view{ display:none; } .view.active{ display:block; }
  /* ===== ニューモーフィズム（やわらかい立体） ===== */
  input[type=text], input[type=password], input[type=number], input[type=date], textarea, select{
    border:none; background:var(--bg); box-shadow:var(--sh-inset); border-radius:14px;
  }
  input:focus, textarea:focus, select:focus{ box-shadow:var(--sh-inset), 0 0 0 2px var(--accent); }
  .card{ border:none; background:var(--bg); box-shadow:var(--sh-raise); }
  .btn{ border:none; background:var(--bg); color:var(--ink); box-shadow:var(--sh-raise-s); transition:box-shadow .14s ease, transform .14s ease; }
  .btn.primary{ background:var(--grad); color:var(--accent-ink); }
  .btn.danger{ background:var(--bg); color:var(--danger); }
  .btn.ghost{ background:transparent; box-shadow:none; }
  .btn:not(.ghost):not(:disabled):active{ box-shadow:var(--sh-inset); transform:scale(.985); }
  .btn.primary:not(:disabled):active{ box-shadow:inset 3px 3px 8px rgba(0,50,70,.35), inset -3px -3px 7px rgba(255,255,255,.35); }
  .btn:disabled{ box-shadow:none; }
  @media (prefers-reduced-motion: reduce){ .btn{ transition:none; } .btn:not(.ghost):not(:disabled):active{ transform:none; } }
  .stepper button{ border:none; background:var(--bg); border-radius:50%; box-shadow:var(--sh-raise-s); transition:box-shadow .14s ease; }
  .stepper button:active{ box-shadow:var(--sh-inset); }
  .stepper .val{ min-width:64px; padding:6px 0; border-radius:14px; box-shadow:var(--sh-inset); }
  .remembered-chip{ border:none; background:var(--bg); box-shadow:var(--sh-inset); border-radius:14px; }
  .keep-open{ background:var(--bg); box-shadow:var(--sh-inset); border-radius:16px; }
  .done .icon{ background:var(--bg); box-shadow:var(--sh-raise-s); }
  .done .icon.pending{ background:var(--bg); box-shadow:var(--sh-inset); }
  .done .icon.celebrate{ background:var(--grad); color:var(--accent-ink); box-shadow:var(--sh-raise); }
  .step .dot{ background:var(--nm-d); }
  .step-line{ background:var(--nm-d); }
  .step.done-step .dot{ background:var(--good); }
  .step.active-step .dot{ background:var(--accent); }
  /* ===== スカイブルー版：丸いカプセル形（レイアウトはそのまま） ===== */
  input[type=text], input[type=password], input[type=number], input[type=date], select{ border-radius:999px; padding-left:18px; padding-right:18px; }
  textarea{ border-radius:18px; }
  .btn, .btn.sm{ border-radius:999px; }
  .search, .toast{ border-radius:999px; }
  .search{ padding:0 16px; }
  .card{ border-radius:26px; }
  .stat{ border-radius:20px; }
  .key-tile, .key-grid.lg .key-tile{ border-radius:18px; }
  .tab-btn{ border-radius:20px; }
  .remembered-chip, .checkout-who, .keep-open{ border-radius:20px; }
  .stepper .val{ border-radius:999px; }
  .sheet{ border-radius:30px 30px 0 0; }
  header .mark{ background-image:var(--grad-text); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="mark">来訪受付</div>
    <div class="sub">下記のフォームにご入力のうえ、受付スタッフをお呼びください</div>
  </header>

  <!-- 入力フォーム -->
  <section class="view active" id="view-form">
    <div class="card">

      <!-- 会社名 -->
      <div class="field-group" id="company-group">
        <label>会社名 *</label>
        <div class="remembered-chip" id="company-chip" style="display:none;">
          <div class="chip-text" id="company-chip-text"></div>
          <button class="btn ghost small" id="company-change" type="button">変更する</button>
        </div>
        <div id="company-input-wrap">
          <input type="text" id="f-company" placeholder="例: 株式会社サンプル" autocomplete="organization">
          <label class="check-row" for="save-company"><input type="checkbox" id="save-company" checked><span>次回のために会社名を保存する</span></label>
        </div>
      </div>

      <!-- お名前 -->
      <div class="field-group" id="name-group">
        <label>お名前 *</label>
        <div class="remembered-chip" id="name-chip" style="display:none;">
          <div class="chip-text" id="name-chip-text"></div>
          <button class="btn ghost small" id="name-change" type="button">変更する</button>
        </div>
        <div id="name-input-wrap">
          <input type="text" id="f-name" placeholder="例: 山田 太郎" autocomplete="name">
          <label class="check-row" for="save-name"><input type="checkbox" id="save-name" checked><span>次回のためにお名前を保存する</span></label>
        </div>
      </div>

      <label>人数（貸し出してほしいカードキーの枚数）</label>
      <div class="stepper">
        <button id="c-minus" type="button" aria-label="減らす">−</button>
        <div class="val mono" id="c-val">1</div>
        <button id="c-plus" type="button" aria-label="増やす">＋</button>
      </div>

      <div class="err" id="f-err"></div>
      <button class="btn primary" id="f-submit" style="margin-top:20px;">受付する</button>
    </div>
    <div class="hint">入力内容は受付スタッフに送信されます。カードキーはスタッフがお渡しします。</div>
    <div class="return-box">
      <div class="return-label">お帰りの際は</div>
      <button class="btn" id="return-open" type="button">カードキーを返却する</button>
    </div>
  </section>

  <!-- 返却の呼び出し -->
  <section class="view" id="view-return">
    <div class="card">
      <h2 class="return-head">カードキーの返却</h2>
      <p class="return-lead">受付のときと同じ会社名・お名前で、スタッフを呼んでください。スタッフがカードキーを受け取りに来ます。</p>
      <label for="r-company">会社名 *</label>
      <input type="text" id="r-company" placeholder="例: 株式会社サンプル" autocomplete="organization">
      <label for="r-name">お名前 *</label>
      <input type="text" id="r-name" placeholder="例: 山田 太郎" autocomplete="name">
      <div class="err" id="r-err"></div>
      <button class="btn primary" id="r-submit" type="button" style="margin-top:20px;">スタッフを呼ぶ</button>
      <button class="btn ghost" id="r-back" type="button" style="margin-top:6px;">受付画面に戻る</button>
    </div>
  </section>

  <!-- 送信完了 -->
  <section class="view" id="view-done">
    <div class="card">
      <div class="done">
        <div class="steps">
          <div class="step done-step"><span class="dot"></span>送信済み</div>
          <div class="step-line"></div>
          <div class="step" id="step-confirmed"><span class="dot"></span>スタッフが確認</div>
        </div>
        <div class="icon pending" id="done-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l2.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <h2 id="done-title">受付スタッフに伝わりました</h2>
        <p id="done-msg">このままお待ちください。まもなくスタッフが確認します。</p>
        <p class="keep-open" id="keep-open"><strong>対応が終わるまで、このページを閉じないでください。</strong><br>もし閉じてしまった場合は、もう一度QRコードを読み取ってください。</p>
        <button class="btn" id="done-return" type="button" style="margin-bottom:8px;">カードキーを返却する</button>
        <button class="btn" id="submit-another" type="button">別の来訪者として受付する</button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "cardkey_visitor_v1";
  var STATUS_POLL_MS = 5000;
  var STATUS_POLL_MAX_ATTEMPTS = 240; // 5秒×240 = 20分でポーリングを打ち切る
  var headcount = 1;
  var busy = false;
  var doneMode = "reception"; // 完了画面が「受付」か「返却」か
  var statusPollTimer = null;
  var statusPollAttempts = 0;

  // 会社名・お名前は、それぞれ独立して「記憶済み(chip)」/「未記憶(入力欄+チェックボックス)」の
  // 状態を持つ。片方だけ記憶されている、という状態も成立する。
  var companyRemembered = null; // 記憶されている会社名の文字列、なければ null
  var nameRemembered = null;    // 記憶されているお名前の文字列、なければ null

  function $(sel){ return document.querySelector(sel); }

  function loadStored(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {};
      var v = JSON.parse(raw);
      return (v && typeof v === "object") ? v : {};
    }catch(e){ return {}; /* localStorageが使えない環境では常に入力欄を表示 */ }
  }

  function saveStored(company, saveCompany, name, saveName){
    try{
      var next = {};
      if(saveCompany && company){ next.company = company; }
      if(saveName && name){ next.name = name; }
      if(next.company || next.name){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    }catch(e){ /* 保存できなくても致命的ではない */ }
  }

  // Apps Script（doPost）の公開URL。デプロイIDが変わらない限りこのままでよい。
  var API_URL = "https://script.google.com/macros/s/AKfycbzPwu3PiCEc5j6BOZbBnmn3ERNM4FJGooYCXGgE4i9vMqRE5l2hTDZiUTDvLk513Xrzpg/exec";

  // text/plain で送るとブラウザの事前確認（プリフライト）が発生しない。
  // 別サイトへの fetch なので Google の Cookie は送られず、
  // 複数アカウントでログインしていても動く。
  function apiCall(payload){
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    }).then(function(res){
      if(!res.ok) throw new Error("http_" + res.status);
      return res.json();
    }).then(function(data){
      if(data && data.ok === false && data.error) throw new Error(data.error);
      return data;
    });
  }

  function switchView(id){
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    $("#"+id).classList.add("active");
  }

  // ---------- 会社名・お名前フィールドの表示切り替え ----------
  function renderCompanyField(){
    var chip = $("#company-chip");
    var wrap = $("#company-input-wrap");
    if(companyRemembered){
      chip.style.display = "";
      wrap.style.display = "none";
      $("#company-chip-text").textContent = companyRemembered;
    } else {
      chip.style.display = "none";
      wrap.style.display = "";
    }
  }
  function renderNameField(){
    var chip = $("#name-chip");
    var wrap = $("#name-input-wrap");
    if(nameRemembered){
      chip.style.display = "";
      wrap.style.display = "none";
      $("#name-chip-text").textContent = nameRemembered;
    } else {
      chip.style.display = "none";
      wrap.style.display = "";
    }
  }
  function refreshFromStorage(){
    var stored = loadStored();
    companyRemembered = stored.company || null;
    nameRemembered = stored.name || null;
    renderCompanyField();
    renderNameField();
  }

  function updateCountLabel(){ $("#c-val").textContent = headcount; }

  // ---------- 送信後のステータス表示（スタッフが「対応する」を押すまで待つ） ----------
  function resetDoneStatusUI(){
    $("#keep-open").style.display = "";
    $("#done-icon").classList.remove("celebrate");
    $("#done-icon").classList.add("pending");
    $("#done-icon").innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l2.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    var step = $("#step-confirmed");
    step.classList.remove("done-step");
    step.classList.add("active-step");
  }
  // 完了時にアイコンのまわりへ弾ける小さな粒（色はグラデーションに合わせる）
  function burstHtml(){
    var colors = ["#74d2ff", "#47a9f4", "#9ad7ff", "#8fa8ff"], out = "";
    for(var i = 0; i < 12; i++){
      out += '<i style="--a:' + (i * 30) + 'deg;--c:' + colors[i % colors.length] + '"></i>';
    }
    return '<span class="burst" aria-hidden="true">' + out + '</span>';
  }
  function markHandledUI(){
    $("#keep-open").style.display = "none";
    var icon = $("#done-icon");
    icon.classList.remove("pending");
    icon.classList.remove("celebrate"); void icon.offsetWidth; icon.classList.add("celebrate");
    icon.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path pathLength="1" d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' + burstHtml();
    var step = $("#step-confirmed");
    step.classList.remove("active-step");
    step.classList.add("done-step");
    if(doneMode === "return"){
      $("#done-title").textContent = "返却を受け付けました";
      $("#done-msg").textContent = "ご来訪ありがとうございました。お気をつけてお帰りください。";
    } else {
      $("#done-title").textContent = "スタッフが確認しました";
      $("#done-msg").textContent = "受付カウンターにお越しください。カードキーをお渡しします。";
    }
  }
  function stopStatusPolling(){
    if(statusPollTimer){ clearInterval(statusPollTimer); statusPollTimer = null; }
  }
  async function pollRequestStatusOnce(id){
    statusPollAttempts++;
    if(statusPollAttempts > STATUS_POLL_MAX_ATTEMPTS){ stopStatusPolling(); return; }
    try{
      var res = await apiCall({ action: "getRequestStatus", id: id });
      if(res && res.status === "handled"){
        markHandledUI();
        stopStatusPolling();
      } else if(res && res.status === "not_found"){
        // 通常は起こらないが、念のため静かにポーリングを止める
        stopStatusPolling();
      }
      // "waiting" ならそのまま次回のポーリングを待つ
    }catch(e){ /* 通信エラーは次回のポーリングで再試行 */ }
  }
  function startStatusPolling(id){
    stopStatusPolling();
    statusPollAttempts = 0;
    resetDoneStatusUI();
    pollRequestStatusOnce(id);
    statusPollTimer = setInterval(function(){ pollRequestStatusOnce(id); }, STATUS_POLL_MS);
  }

  // ---------- 受付時のチャイム（ピンポーン） ----------
  // ブラウザは「タップしたとき」以外に音を鳴らせないため、
  // 受付ボタンを押した瞬間に AudioContext を準備し、送信成功後に鳴らす。
  var audioCtx = null;
  function prepareAudio(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state === "suspended") audioCtx.resume();
      // iOS向け：タップ中に無音を一瞬鳴らして音声を有効化しておく
      var b = audioCtx.createBuffer(1, 1, 22050);
      var src = audioCtx.createBufferSource();
      src.buffer = b; src.connect(audioCtx.destination); src.start(0);
    }catch(e){ /* 音が出せない環境でも受付は続ける */ }
  }
  function playDoorbell(){
    if(!audioCtx) return;
    try{
      var now = audioCtx.currentTime + 0.02;
      // 玄関チャイムのような2音（高い音→低い音）
      [[659.25, 0], [523.25, 0.55]].forEach(function(n){
        var t = now + n[1];
        [1, 2, 3].forEach(function(h, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.value = n[0] * h;
          var peak = [0.5, 0.12, 0.05][i];
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(t); osc.stop(t + 1.5);
        });
      });
    }catch(e){}
  }
  function vibrate(){
    try{ if(navigator.vibrate) navigator.vibrate([120, 80, 120]); }catch(e){}
  }

  function currentInput(){
    var company = companyRemembered ? companyRemembered : $("#f-company").value.trim();
    var name = nameRemembered ? nameRemembered : $("#f-name").value.trim();
    var saveCompany = companyRemembered ? true : $("#save-company").checked;
    var saveName = nameRemembered ? true : $("#save-name").checked;
    return { company: company, name: name, saveCompany: saveCompany, saveName: saveName };
  }

  async function submit(){
    if(busy) return;
    var errEl = $("#f-err");
    errEl.classList.remove("show");
    var input = currentInput();
    if(!input.company || !input.name){
      errEl.textContent = "会社名とお名前を入力してください";
      errEl.classList.add("show");
      return;
    }
    busy = true;
    prepareAudio();
    $("#f-submit").disabled = true;
    $("#f-submit").textContent = "送信中…";
    try{
      var addResult = await apiCall({ action: "addVisitorRequest", company: input.company, name: input.name, headcount: headcount });
      saveStored(input.company, input.saveCompany, input.name, input.saveName);
      setDoneMode("reception");
      $("#done-title").textContent = "受付スタッフに伝わりました";
      $("#done-msg").textContent = input.company + " 様、" + input.name + " 様（" + headcount + "名）で受付スタッフに伝えました。このままお待ちください。";
      switchView("view-done");
      playDoorbell();
      vibrate();
      if(addResult && addResult.id){ startStatusPolling(addResult.id); }
    }catch(e){
      var detail = (e && e.message) ? String(e.message) : "";
      errEl.textContent = "送信に失敗しました。電波状況をご確認のうえ、もう一度お試しください"
        + (detail ? "（エラー内容: " + detail + "）" : "");
      errEl.classList.add("show");
    }finally{
      busy = false;
      $("#f-submit").disabled = false;
      $("#f-submit").textContent = "受付する";
    }
  }

  $("#c-minus").addEventListener("click", function(){ if(headcount > 1){ headcount--; updateCountLabel(); } });
  $("#c-plus").addEventListener("click", function(){ if(headcount < 50){ headcount++; updateCountLabel(); } });
  // ---------- 返却の呼び出し ----------
  function setDoneMode(mode){
    doneMode = mode;
    $("#done-return").style.display = (mode === "return") ? "none" : "";
    $("#submit-another").textContent = (mode === "return") ? "受付画面に戻る" : "別の来訪者として受付する";
  }
  function openReturnView(){
    stopStatusPolling();
    // 受付時に保存した会社名・お名前（または入力途中の内容）を入れておく
    var input = currentInput();
    $("#r-company").value = input.company || "";
    $("#r-name").value = input.name || "";
    $("#r-err").classList.remove("show");
    switchView("view-return");
  }
  async function submitReturn(){
    if(busy) return;
    var errEl = $("#r-err");
    errEl.classList.remove("show");
    var company = $("#r-company").value.trim();
    var name = $("#r-name").value.trim();
    if(!company || !name){
      errEl.textContent = "会社名とお名前を入力してください";
      errEl.classList.add("show");
      return;
    }
    busy = true;
    prepareAudio();
    var btn = $("#r-submit");
    btn.disabled = true;
    btn.textContent = "呼び出し中…";
    try{
      var res = await apiCall({ action: "addReturnRequest", company: company, name: name });
      setDoneMode("return");
      $("#done-title").textContent = "スタッフを呼びました";
      $("#done-msg").textContent = company + " 様、" + name + " 様。このままお待ちください。スタッフがカードキーを受け取りに来ます。";
      switchView("view-done");
      playDoorbell();
      vibrate();
      if(res && res.id){ startStatusPolling(res.id); }
    }catch(e){
      var detail = (e && e.message) ? String(e.message) : "";
      errEl.textContent = "呼び出しに失敗しました。電波状況をご確認のうえ、もう一度お試しください"
        + (detail ? "（エラー内容: " + detail + "）" : "");
      errEl.classList.add("show");
    }finally{
      busy = false;
      btn.disabled = false;
      btn.textContent = "スタッフを呼ぶ";
    }
  }
  $("#return-open").addEventListener("click", openReturnView);
  $("#done-return").addEventListener("click", openReturnView);
  $("#r-submit").addEventListener("click", submitReturn);
  $("#r-back").addEventListener("click", function(){ switchView("view-form"); });

  $("#f-submit").addEventListener("click", submit);

  $("#company-change").addEventListener("click", function(){
    // 記憶済みの会社名を編集し直せるように、入力欄へ切り替える（チェックは既定でON）
    $("#f-company").value = companyRemembered || "";
    $("#save-company").checked = true;
    companyRemembered = null;
    renderCompanyField();
    $("#f-company").focus();
  });
  $("#name-change").addEventListener("click", function(){
    $("#f-name").value = nameRemembered || "";
    $("#save-name").checked = true;
    nameRemembered = null;
    renderNameField();
    $("#f-name").focus();
  });

  $("#submit-another").addEventListener("click", function(){
    stopStatusPolling();
    headcount = 1;
    updateCountLabel();
    $("#f-company").value = "";
    $("#f-name").value = "";
    $("#f-err").classList.remove("show");
    // 保存されている内容（会社名・お名前それぞれ）を読み直して表示する
    refreshFromStorage();
    switchView("view-form");
  });

  refreshFromStorage();
  updateCountLabel();
})();
</script>

</body>
</html>
