<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>来訪受付</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#eef2ee; --surface:#ffffff; --surface-2:#e3e9e2; --border:#ccd5cb;
    --ink:#16211c; --ink-muted:#54635b;
    --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcefea;
    --danger:#a8362c; --danger-soft:#f8e2df;
    --good:#1b7a4b; --good-soft:#e1f2e7;
    --shadow: 0 1px 2px rgba(20,30,25,.06), 0 6px 20px rgba(20,30,25,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121815; --surface:#1a2320; --surface-2:#212b26; --border:#344039;
      --ink:#eaf1ec; --ink-muted:#9fb0a7;
      --accent:#57ddc0; --accent-ink:#08221d; --accent-soft:#173733;
      --danger:#f4867e; --danger-soft:#3a1613;
      --good:#77dd9f; --good-soft:#123321;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121815; --surface:#1a2320; --surface-2:#212b26; --border:#344039;
    --ink:#eaf1ec; --ink-muted:#9fb0a7;
    --accent:#57ddc0; --accent-ink:#08221d; --accent-soft:#173733;
    --danger:#f4867e; --danger-soft:#3a1613;
    --good:#77dd9f; --good-soft:#123321;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .wrap{ max-width:440px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding:24px 18px 32px; }
  header{ text-align:center; margin-bottom:18px; }
  header .mark{ font-size:19px; font-weight:700; letter-spacing:.02em; }
  header .sub{ font-size:12.5px; color:var(--ink-muted); margin-top:4px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:var(--shadow); }

  .field-group{ margin-bottom:4px; }

  label{ display:block; font-size:12.5px; color:var(--ink-muted); margin:14px 0 6px; font-weight:600; }
  label:first-of-type{ margin-top:0; }
  input[type=text]{
    width:100%; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:12px 13px; font-size:16px; font-family:inherit; outline:none;
  }
  input:focus{ border-color:var(--accent); }

  .remembered-chip{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:11px 13px;
  }
  .remembered-chip .chip-text{ font-size:15px; font-weight:700; overflow-wrap:anywhere; }

  .check-row{
    display:flex; align-items:center; gap:8px; margin:9px 0 4px;
    font-size:12.5px; color:var(--ink-muted); font-weight:500; cursor:pointer;
  }
  .check-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--accent); flex:none; cursor:pointer; margin:0; }

  .stepper{ display:flex; align-items:center; gap:12px; justify-content:center; margin-top:6px; }
  .stepper button{
    width:46px; height:46px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
    font-size:20px; color:var(--ink); flex:none; font-family:inherit; cursor:pointer;
  }
  .stepper .val{ min-width:56px; text-align:center; font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:700; }

  button.btn{ font-family:inherit; cursor:pointer; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:13px 16px;
    font-size:15.5px; font-weight:700; width:100%;
  }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--accent); font-weight:600; font-size:13.5px; padding:8px; }
  .btn.ghost.small{ width:auto; padding:7px 11px; font-size:12.5px; flex:none; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .err{ font-size:12.5px; color:var(--danger); margin-top:10px; text-align:center; display:none; }
  .err.show{ display:block; }

  .done{ text-align:center; padding:20px 6px; }
  .done .icon{ width:56px; height:56px; border-radius:999px; background:var(--good-soft); color:var(--good); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; transition:background .25s,color .25s; }
  .done .icon.pending{ background:var(--surface-2); color:var(--ink-muted); }
  .done h2{ font-size:19px; margin:0 0 8px; }
  .done p{ font-size:14px; color:var(--ink-muted); line-height:1.7; margin:0 0 20px; }

  .steps{ display:flex; align-items:center; justify-content:center; gap:8px; margin:0 0 18px; }
  .step{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-muted); }
  .step .dot{ width:9px; height:9px; border-radius:999px; background:var(--border); flex:none; }
  .step.done-step{ color:var(--good); font-weight:600; }
  .step.done-step .dot{ background:var(--good); }
  .step.active-step .dot{ background:var(--accent); animation:pulse 1.4s ease-in-out infinite; }
  .step-line{ width:20px; height:1px; background:var(--border); flex:none; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  @media (prefers-reduced-motion: reduce){ .step.active-step .dot{ animation:none; } }

  .hint{ font-size:12px; color:var(--ink-muted); text-align:center; margin-top:14px; line-height:1.6; }
  .view{ display:none; } .view.active{ display:block; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="mark">来訪受付</div>
    <div class="sub">下記のフォームにご入力のうえ、受付スタッフをお呼びください</div>
  </header>

  <!-- 入力フォーム -->
  <section class="view active" id="view-form">
    <div class="card">

      <!-- 会社名 -->
      <div class="field-group" id="company-group">
        <label>会社名 *</label>
        <div class="remembered-chip" id="company-chip" style="display:none;">
          <div class="chip-text" id="company-chip-text"></div>
          <button class="btn ghost small" id="company-change" type="button">変更する</button>
        </div>
        <div id="company-input-wrap">
          <input type="text" id="f-company" placeholder="例: 株式会社サンプル" autocomplete="organization">
          <label class="check-row" for="save-company"><input type="checkbox" id="save-company" checked><span>次回のために会社名を保存する</span></label>
        </div>
      </div>

      <!-- お名前 -->
      <div class="field-group" id="name-group">
        <label>お名前 *</label>
        <div class="remembered-chip" id="name-chip" style="display:none;">
          <div class="chip-text" id="name-chip-text"></div>
          <button class="btn ghost small" id="name-change" type="button">変更する</button>
        </div>
        <div id="name-input-wrap">
          <input type="text" id="f-name" placeholder="例: 山田 太郎" autocomplete="name">
          <label class="check-row" for="save-name"><input type="checkbox" id="save-name" checked><span>次回のためにお名前を保存する</span></label>
        </div>
      </div>

      <label>人数（貸し出してほしいカードキーの枚数）</label>
      <div class="stepper">
        <button id="c-minus" type="button" aria-label="減らす">−</button>
        <div class="val mono" id="c-val">1</div>
        <button id="c-plus" type="button" aria-label="増やす">＋</button>
      </div>

      <div class="err" id="f-err"></div>
      <button class="btn primary" id="f-submit" style="margin-top:20px;">受付する</button>
    </div>
    <div class="hint">入力内容は受付スタッフに送信されます。カードキーはスタッフがお渡しします。</div>
  </section>

  <!-- 送信完了 -->
  <section class="view" id="view-done">
    <div class="card">
      <div class="done">
        <div class="steps">
          <div class="step done-step"><span class="dot"></span>送信済み</div>
          <div class="step-line"></div>
          <div class="step" id="step-confirmed"><span class="dot"></span>スタッフが確認</div>
        </div>
        <div class="icon pending" id="done-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l2.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <h2 id="done-title">受付スタッフに伝わりました</h2>
        <p id="done-msg">このままお待ちください。まもなくスタッフが確認します。</p>
        <button class="btn" id="submit-another" type="button">別の来訪者として受付する</button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "cardkey_visitor_v1";
  var STATUS_POLL_MS = 5000;
  var STATUS_POLL_MAX_ATTEMPTS = 240; // 5秒×240 = 20分でポーリングを打ち切る
  var headcount = 1;
  var busy = false;
  var statusPollTimer = null;
  var statusPollAttempts = 0;

  // 会社名・お名前は、それぞれ独立して「記憶済み(chip)」/「未記憶(入力欄+チェックボックス)」の
  // 状態を持つ。片方だけ記憶されている、という状態も成立する。
  var companyRemembered = null; // 記憶されている会社名の文字列、なければ null
  var nameRemembered = null;    // 記憶されているお名前の文字列、なければ null

  function $(sel){ return document.querySelector(sel); }

  function loadStored(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {};
      var v = JSON.parse(raw);
      return (v && typeof v === "object") ? v : {};
    }catch(e){ return {}; /* localStorageが使えない環境では常に入力欄を表示 */ }
  }

  function saveStored(company, saveCompany, name, saveName){
    try{
      var next = {};
      if(saveCompany && company){ next.company = company; }
      if(saveName && name){ next.name = name; }
      if(next.company || next.name){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    }catch(e){ /* 保存できなくても致命的ではない */ }
  }

  // Apps Script（doPost）の公開URL。デプロイIDが変わらない限りこのままでよい。
  var API_URL = "https://script.google.com/macros/s/AKfycbzPwu3PiCEc5j6BOZbBnmn3ERNM4FJGooYCXGgE4i9vMqRE5l2hTDZiUTDvLk513Xrzpg/exec";

  // text/plain で送るとブラウザの事前確認（プリフライト）が発生しない。
  // 別サイトへの fetch なので Google の Cookie は送られず、
  // 複数アカウントでログインしていても動く。
  function apiCall(payload){
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    }).then(function(res){
      if(!res.ok) throw new Error("http_" + res.status);
      return res.json();
    }).then(function(data){
      if(data && data.ok === false && data.error) throw new Error(data.error);
      return data;
    });
  }

  function switchView(id){
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    $("#"+id).classList.add("active");
  }

  // ---------- 会社名・お名前フィールドの表示切り替え ----------
  function renderCompanyField(){
    var chip = $("#company-chip");
    var wrap = $("#company-input-wrap");
    if(companyRemembered){
      chip.style.display = "";
      wrap.style.display = "none";
      $("#company-chip-text").textContent = companyRemembered;
    } else {
      chip.style.display = "none";
      wrap.style.display = "";
    }
  }
  function renderNameField(){
    var chip = $("#name-chip");
    var wrap = $("#name-input-wrap");
    if(nameRemembered){
      chip.style.display = "";
      wrap.style.display = "none";
      $("#name-chip-text").textContent = nameRemembered;
    } else {
      chip.style.display = "none";
      wrap.style.display = "";
    }
  }
  function refreshFromStorage(){
    var stored = loadStored();
    companyRemembered = stored.company || null;
    nameRemembered = stored.name || null;
    renderCompanyField();
    renderNameField();
  }

  function updateCountLabel(){ $("#c-val").textContent = headcount; }

  // ---------- 送信後のステータス表示（スタッフが「対応する」を押すまで待つ） ----------
  function resetDoneStatusUI(){
    $("#done-icon").classList.add("pending");
    $("#done-icon").innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l2.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    var step = $("#step-confirmed");
    step.classList.remove("done-step");
    step.classList.add("active-step");
  }
  function markHandledUI(){
    var icon = $("#done-icon");
    icon.classList.remove("pending");
    icon.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var step = $("#step-confirmed");
    step.classList.remove("active-step");
    step.classList.add("done-step");
    $("#done-title").textContent = "スタッフが確認しました";
    $("#done-msg").textContent = "受付カウンターにお越しください。カードキーをお渡しします。";
  }
  function stopStatusPolling(){
    if(statusPollTimer){ clearInterval(statusPollTimer); statusPollTimer = null; }
  }
  async function pollRequestStatusOnce(id){
    statusPollAttempts++;
    if(statusPollAttempts > STATUS_POLL_MAX_ATTEMPTS){ stopStatusPolling(); return; }
    try{
      var res = await apiCall({ action: "getRequestStatus", id: id });
      if(res && res.status === "handled"){
        markHandledUI();
        stopStatusPolling();
      } else if(res && res.status === "not_found"){
        // 通常は起こらないが、念のため静かにポーリングを止める
        stopStatusPolling();
      }
      // "waiting" ならそのまま次回のポーリングを待つ
    }catch(e){ /* 通信エラーは次回のポーリングで再試行 */ }
  }
  function startStatusPolling(id){
    stopStatusPolling();
    statusPollAttempts = 0;
    resetDoneStatusUI();
    pollRequestStatusOnce(id);
    statusPollTimer = setInterval(function(){ pollRequestStatusOnce(id); }, STATUS_POLL_MS);
  }

  function currentInput(){
    var company = companyRemembered ? companyRemembered : $("#f-company").value.trim();
    var name = nameRemembered ? nameRemembered : $("#f-name").value.trim();
    var saveCompany = companyRemembered ? true : $("#save-company").checked;
    var saveName = nameRemembered ? true : $("#save-name").checked;
    return { company: company, name: name, saveCompany: saveCompany, saveName: saveName };
  }

  async function submit(){
    if(busy) return;
    var errEl = $("#f-err");
    errEl.classList.remove("show");
    var input = currentInput();
    if(!input.company || !input.name){
      errEl.textContent = "会社名とお名前を入力してください";
      errEl.classList.add("show");
      return;
    }
    busy = true;
    $("#f-submit").disabled = true;
    $("#f-submit").textContent = "送信中…";
    try{
      var addResult = await apiCall({ action: "addVisitorRequest", company: input.company, name: input.name, headcount: headcount });
      saveStored(input.company, input.saveCompany, input.name, input.saveName);
      $("#done-title").textContent = "受付スタッフに伝わりました";
      $("#done-msg").textContent = input.company + " 様、" + input.name + " 様（" + headcount + "名）で受付スタッフに伝えました。このままお待ちください。";
      switchView("view-done");
      if(addResult && addResult.id){ startStatusPolling(addResult.id); }
    }catch(e){
      var detail = (e && e.message) ? String(e.message) : "";
      errEl.textContent = "送信に失敗しました。電波状況をご確認のうえ、もう一度お試しください"
        + (detail ? "（エラー内容: " + detail + "）" : "");
      errEl.classList.add("show");
    }finally{
      busy = false;
      $("#f-submit").disabled = false;
      $("#f-submit").textContent = "受付する";
    }
  }

  $("#c-minus").addEventListener("click", function(){ if(headcount > 1){ headcount--; updateCountLabel(); } });
  $("#c-plus").addEventListener("click", function(){ if(headcount < 50){ headcount++; updateCountLabel(); } });
  $("#f-submit").addEventListener("click", submit);

  $("#company-change").addEventListener("click", function(){
    // 記憶済みの会社名を編集し直せるように、入力欄へ切り替える（チェックは既定でON）
    $("#f-company").value = companyRemembered || "";
    $("#save-company").checked = true;
    companyRemembered = null;
    renderCompanyField();
    $("#f-company").focus();
  });
  $("#name-change").addEventListener("click", function(){
    $("#f-name").value = nameRemembered || "";
    $("#save-name").checked = true;
    nameRemembered = null;
    renderNameField();
    $("#f-name").focus();
  });

  $("#submit-another").addEventListener("click", function(){
    stopStatusPolling();
    headcount = 1;
    updateCountLabel();
    $("#f-company").value = "";
    $("#f-name").value = "";
    $("#f-err").classList.remove("show");
    // 保存されている内容（会社名・お名前それぞれ）を読み直して表示する
    refreshFromStorage();
    switchView("view-form");
  });

  refreshFromStorage();
  updateCountLabel();
})();
</script>

</body>
</html>
